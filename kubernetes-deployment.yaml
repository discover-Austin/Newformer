# Chrysalis-Transformer X (CT-X) Kubernetes Deployment
apiVersion: v1
kind: Namespace
metadata:
  name: ct-x-production
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ct-x-models-pvc
  namespace: ct-x-production
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 500Gi
  storageClassName: fast-ssd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ct-x-inference
  namespace: ct-x-production
  labels:
    app: ct-x
    component: inference
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ct-x
      component: inference
  template:
    metadata:
      labels:
        app: ct-x
        component: inference
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
      - name: ct-x
        image: your-registry/ct-x-inference:v2.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "64Gi"
            cpu: "16"
            nvidia.com/gpu: 2
          limits:
            memory: "128Gi"
            cpu: "32"
            nvidia.com/gpu: 4
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          capabilities:
            drop:
              - ALL
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        env:
        - name: MODEL_PATH
          value: "/models/ct-x-70b"
        - name: DEVICE
          value: "auto"
        - name: PORT
          value: "8000"
        - name: CUDA_VISIBLE_DEVICES
          value: "0,1,2,3"
        - name: PYTHONUNBUFFERED
          value: "1"
        volumeMounts:
        - name: model-cache
          mountPath: /models
          readOnly: true
        - name: logs
          mountPath: /logs
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: ct-x-models-pvc
      - name: logs
        emptyDir: {}
      nodeSelector:
        accelerator: nvidia-gpu
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
---
apiVersion: v1
kind: Service
metadata:
  name: ct-x-service
  namespace: ct-x-production
  labels:
    app: ct-x
spec:
  selector:
    app: ct-x
    component: inference
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
    name: http
  type: LoadBalancer
  sessionAffinity: ClientIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ct-x-hpa
  namespace: ct-x-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ct-x-inference
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ct-x-pdb
  namespace: ct-x-production
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: ct-x
      component: inference
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ct-x-ingress
  namespace: ct-x-production
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - ct-x.yourdomain.com
    secretName: ct-x-tls
  rules:
  - host: ct-x.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ct-x-service
            port:
              number: 80
