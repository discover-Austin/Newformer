# CT-X-405B Configuration
# Large-scale 405 billion parameter model

model:
  name: "ct-x-405b"
  version: "2.0.0"

architecture:
  vocab_size: 128000
  hidden_dim: 16384
  num_layers: 126
  num_heads: 128
  intermediate_dim: 53248
  max_position_embeddings: 131072  # 128K context

  # QMH-Attention
  mamba_ratio: 0.08
  quantum_depth: 8
  sparsity_pattern: "adaptive"
  sparsity_ratio: 0.18

  # Consciousness
  consciousness_threshold: 0.85
  phi_target: 0.87
  reflection_heads: 16

  # Dropout
  dropout: 0.1
  quantum_dropout: 0.05
  layer_norm_eps: 1.0e-6

genetic_algorithm:
  population_size: 100
  mutation_rate: 0.06
  selection_pressure: 0.90
  crossover_points: 5
  evolution_frequency: 2000

constitutional_constraints:
  max_parameters: 500000000000  # 500B max
  safety_alignment: 0.99
  evolution_rate_limit: 0.06
  violation_threshold: 0.12

training:
  batch_size: 16
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 5000
  max_steps: 2000000
  gradient_clip: 1.0

  # Byzantine Fault Tolerance
  num_replicas: 15
  fault_tolerance: 5

  # Optimizer
  optimizer_type: "hybrid_quantum_classical"
  betas: [0.9, 0.95]
  eps: 1.0e-8

inference:
  max_batch_size: 16
  timeout_ms: 100
  enable_compilation: true
  default_temperature: 0.7
  default_top_p: 0.95
  default_top_k: 50

hardware:
  target_gpus: 16
  gpu_memory_gb: 80
  cpu_cores: 128
  ram_gb: 512

deployment:
  min_replicas: 5
  max_replicas: 20
  target_cpu_utilization: 60
  target_memory_utilization: 75
