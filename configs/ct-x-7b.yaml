# CT-X-7B Configuration
# Efficient 7 billion parameter model for edge deployment

model:
  name: "ct-x-7b"
  version: "2.0.0"

architecture:
  vocab_size: 32000
  hidden_dim: 4096
  num_layers: 32
  num_heads: 32
  intermediate_dim: 11008
  max_position_embeddings: 8192

  # QMH-Attention
  mamba_ratio: 0.10
  quantum_depth: 4
  sparsity_pattern: "adaptive"
  sparsity_ratio: 0.20

  # Consciousness
  consciousness_threshold: 0.80
  phi_target: 0.80
  reflection_heads: 4

  # Dropout
  dropout: 0.1
  quantum_dropout: 0.05
  layer_norm_eps: 1.0e-6

genetic_algorithm:
  population_size: 30
  mutation_rate: 0.10
  selection_pressure: 0.80
  crossover_points: 2
  evolution_frequency: 500

constitutional_constraints:
  max_parameters: 10000000000  # 10B max
  safety_alignment: 0.96
  evolution_rate_limit: 0.10
  violation_threshold: 0.18

training:
  batch_size: 64
  learning_rate: 8.0e-4
  weight_decay: 0.01
  warmup_steps: 1000
  max_steps: 500000
  gradient_clip: 1.0

  # Byzantine Fault Tolerance
  num_replicas: 5
  fault_tolerance: 1

  # Optimizer
  optimizer_type: "hybrid_quantum_classical"
  betas: [0.9, 0.999]
  eps: 1.0e-8

inference:
  max_batch_size: 64
  timeout_ms: 30
  enable_compilation: true
  default_temperature: 0.7
  default_top_p: 0.95
  default_top_k: 50

hardware:
  target_gpus: 1
  gpu_memory_gb: 24
  cpu_cores: 16
  ram_gb: 32

deployment:
  min_replicas: 2
  max_replicas: 8
  target_cpu_utilization: 75
  target_memory_utilization: 85
